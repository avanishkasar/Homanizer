name: CI

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "avanishkasar"
          git config user.email "151715253+avanishkasar@users.noreply.github.com"

      - name: Run checks
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: python .github/scripts/build_check.py
